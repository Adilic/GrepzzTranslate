[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grepzztranslate"
version = "0.1.7"
description = "Offline English and Japanese screen lookup for Windows"
requires-python = ">=3.12"
dependencies = [
  "ctranslate2>=4.8,<5",
  "sentencepiece>=0.2,<0.3",
  "PySide6>=6.8,<7",
  "SudachiPy>=0.6.10,<0.7",
  "SudachiDict-core>=20250129",
  "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyInstaller>=6.12,<7"]

[project.gui-scripts]
grepzztranslate = "grepzztranslate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
