[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "textstats-kit"
version = "0.1.0"
description = "A minimal teaching project for Python environments and packaging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
textstats = "textstats_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
textstats_kit = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
